services:
  postgres:
    image: postgres:16-alpine
    container_name: dtk-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dtk
      POSTGRES_USER: dtk
      POSTGRES_PASSWORD: dtk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
