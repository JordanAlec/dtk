services:
  mongodb:
    image: mongo:7
    container_name: dtk-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dtk
      MONGO_INITDB_ROOT_PASSWORD: dtk
      MONGO_INITDB_DATABASE: dtk
    volumes:
      - mongodb_data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  mongodb_data:
